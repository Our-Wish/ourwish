<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OURWISH</title>
    <meta name="description" content="목표만 알려주면 내게 맞는 예·적금을 빠르게 찾아드려요. OURWISH">
    <!-- 브라우저 탭 색(모바일 주소창 배경) — 내비게이션 바 색과 맞춤 -->
    <meta name="theme-color" content="#F7F9FB">

    <!-- 링크 공유 미리보기(카카오톡·문자·슬랙 등이 읽는 Open Graph) — 이미지는 절대 URL이어야 함 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="OURWISH">
    <meta property="og:title" content="OURWISH">
    <meta property="og:description" content="목표만 알려주면 내게 맞는 예·적금을 빠르게 찾아드려요.">
    <meta property="og:url" content="https://our-wish.site/">
    <meta property="og:image" content="https://our-wish.site/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="ko_KR">
    <!-- 트위터/X 카드 (큰 이미지 형식) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OURWISH">
    <meta name="twitter:description" content="목표만 알려주면 내게 맞는 예·적금을 빠르게 찾아드려요.">
    <meta name="twitter:image" content="https://our-wish.site/og-image.png">

    <!-- 아이콘: 브라우저 탭(PNG) / iOS 홈화면 / 안드로이드 홈화면(manifest) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
