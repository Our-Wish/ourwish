name: Backend CI

# 백엔드(backend_dir) 파일이 바뀐 PR에서만 검사. 프론트만 고친 PR엔 영향 없음.
on:
  pull_request:
    paths:
      - "backend_dir/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [develop]
    paths:
      - "backend_dir/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend_dir # 모든 run 단계를 backend_dir 안에서 실행
    env:
      # CI 전용 더미 키 — 실제 비밀값 아님. Django 구동에만 필요(서버 .env와 무관).
      SECRET_KEY: ci-dummy-secret-key-not-for-production
      DEBUG: "True"
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend_dir/requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 설정·모델 정의 검사 (check)
        run: python manage.py check

      - name: 마이그레이션 누락 검사
        run: python manage.py makemigrations --check --dry-run

      - name: 단위 테스트
        run: python manage.py test
